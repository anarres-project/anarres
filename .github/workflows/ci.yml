name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:wip
      # The Action and the plugin run the committed bundles, so each must be built from exactly
      # this source.
      - name: The Divlab and CLI bundles match their source
        run: npm run bundle && git diff --exit-code -- packages/divlab/dist packages/cli/dist
