name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:wip
      # The Action runs the committed bundle, so it must be built from exactly this source.
      - name: The Divlab bundle matches its source
        run: npm run bundle && git diff --exit-code -- packages/divlab/dist
