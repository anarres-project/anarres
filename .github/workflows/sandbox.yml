name: Sandbox acceptance

# The acceptance scenarios against real repositories in the GitHub sandbox organisation.
# Slower than the gate, so not part of it: runs on main and on demand. A push that changes only
# documents is skipped: the run reads none of them, and each run spends about 3,000 of the
# hourly allowance of GitHub requests (SANDBOX.md).
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# Runs share the sandbox; one at a time keeps them within GitHub's rate limits.
concurrency:
  group: sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    # The token is only available to workflows on main (environment protection).
    environment: sandbox
    # Each merge waits for a real Divlab run in the sandbox: about 11 minutes in four workers.
    # A safety margin, not a budget: a full run takes about 60 minutes (Bernard, 2026-10-29).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:acceptance:sandbox
        env:
          ANARRES_SANDBOX_ORG: ${{ vars.ANARRES_SANDBOX_ORG }}
          ANARRES_SANDBOX_TOKEN: ${{ secrets.ANARRES_SANDBOX_TOKEN }}
          ANARRES_SANDBOX_MEMBERS_ORG: ${{ vars.ANARRES_SANDBOX_MEMBERS_ORG }}
          ANARRES_SANDBOX_MEMBERS_TOKEN: ${{ secrets.ANARRES_SANDBOX_MEMBERS_TOKEN }}
          ANARRES_SANDBOX_SECOND_MEMBER_TOKEN: ${{ secrets.ANARRES_SANDBOX_SECOND_MEMBER_TOKEN }}
          ANARRES_SANDBOX_THIRD_MEMBER_TOKEN: ${{ secrets.ANARRES_SANDBOX_THIRD_MEMBER_TOKEN }}
