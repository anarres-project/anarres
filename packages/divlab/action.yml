name: Divlab
description: Routes work merged into an Anarres project to the next tasks.
inputs:
  token:
    description: The token Divlab acts with, the project repository's own by default.
    default: ${{ github.token }}
  app:
    description: The slug of Divlab's GitHub App, so Divlab knows its own changes to main.
    default: ""
  governance:
    description: The repository holding the governance file, if not Anarres's own.
    default: ""
runs:
  using: node24
  main: dist/index.js
