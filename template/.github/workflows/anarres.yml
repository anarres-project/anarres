name: Divlab

# The tripwire (decisions 0005 and 0006). Only Divlab merges, and it records every merge it makes,
# so a feedback signal on main with no record reached main some other way: Divlab records it as
# not accepted, alerts PDC coordinators, and never routes it. It runs on a push to main, never on
# a pull request, so no code from a member's fork ever runs here.
on:
  push:
    branches: [main]
    paths: ["feedback/**"]

# The workflow's own token gets nothing: Divlab acts only with its App's token, the only actor
# the project's main branch admits.
permissions: {}

# Shared with the pull request workflow: one Divlab run per project at a time keeps decisions in
# order. Every run waits its turn: by default GitHub keeps only one waiting and cancels the rest.
concurrency:
  group: divlab
  cancel-in-progress: false
  queue: max

jobs:
  divlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: this job holds the App's key.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DIVLAB_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIVLAB_APP_PRIVATE_KEY }}
      - uses: anarres-project/anarres/packages/divlab@main
        with:
          token: ${{ steps.app.outputs.token }}
          app: ${{ steps.app.outputs.app-slug }}
