name: Divlab (claims)

# Divlab acts on a member's claim, made by commenting on a task. The comment is data: Divlab reads
# it from the event and runs nothing a member wrote. Edited comments are not claims: a claim is
# decided as it was made.
on:
  issue_comment:
    types: [created]

# The workflow's own token gets nothing: Divlab acts only with its App's token.
permissions: {}

# Shared with the other Divlab workflows: one Divlab run per project at a time keeps decisions in
# order, so of two claims on one task, the one Divlab takes first is decided first. Every run
# waits its turn: by default GitHub keeps only one waiting and cancels the rest.
concurrency:
  group: divlab
  cancel-in-progress: false
  queue: max

jobs:
  divlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: this job holds the App's key.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DIVLAB_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIVLAB_APP_PRIVATE_KEY }}
      - uses: anarres-project/anarres/packages/divlab@main
        with:
          token: ${{ steps.app.outputs.token }}
