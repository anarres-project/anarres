name: Divlab (pull requests)

# Divlab validates a member's pull request and, if it passes, merges it and routes the work
# (decision 0006). This event runs the workflow as this project's main branch has it, never as
# the pull request has it, so nothing a pull request changes can run here.
# A draft is work under way: Divlab never merges one, but counts it as activity on its task. It
# runs again when the member marks the draft ready.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# The workflow's own token gets nothing: Divlab acts only with its App's token.
permissions: {}

# Shared with the push workflow: one Divlab run per project at a time keeps decisions in
# order. Every run waits its turn: by default GitHub keeps only one waiting and cancels the rest.
concurrency:
  group: divlab
  cancel-in-progress: false
  queue: max

jobs:
  divlab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: this job holds the App's key.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DIVLAB_APP_CLIENT_ID }}
          private-key: ${{ secrets.DIVLAB_APP_PRIVATE_KEY }}
      # Divlab merges as its App, the only actor the project's ruleset lets merge.
      - uses: anarres-project/anarres/packages/divlab@main
        with:
          token: ${{ steps.app.outputs.token }}
          app: ${{ steps.app.outputs.app-slug }}
          governance: ${{ vars.ANARRES_GOVERNANCE }}
